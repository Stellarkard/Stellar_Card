version: '3.8'

services:
  backend:
    build:
      context: ./stellar_card-backend
      dockerfile: Dockerfile
    container_name: stellar_card-backend
    ports:
      - "4000:4000"
    env_file:
      - ./stellar_card-backend/.env.example
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DB_PATH=/app/data/stellar_card.db
      - CARDS402_BASE_URL=http://localhost:4000
      - STELLAR_NETWORK=testnet
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - stellar_card-net

  frontend:
    build:
      context: ./stellar_card-frontend
      dockerfile: Dockerfile
    container_name: stellar_card-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stellar_card-net

volumes:
  backend-data:
    driver: local

networks:
  stellar_card-net:
    driver: bridge
