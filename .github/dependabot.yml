version: 2
updates:
  # npm dependencies — SDK package
  - package-ecosystem: npm
    directory: '/stellar_card-sdk'
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: UTC
    open-pull-requests-limit: 5
    reviewers:
      - 'devpeter999'
    labels:
      - 'dependencies'
      - 'security'
      - 'sdk'
    commit-message:
      prefix: 'chore'
      prefix-scope: 'deps'
      include: 'scope'
    pull-request-branch-name:
      separator: '/'
    rebase-strategy: 'auto'
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    ignore:
      # Ignore major version bumps for certain packages (manual review recommended)
      - dependency-name: '@stellar/stellar-sdk'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  # npm dependencies — Backend API
  - package-ecosystem: npm
    directory: '/stellar_card-backend'
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: UTC
    open-pull-requests-limit: 5
    reviewers:
      - 'devpeter999'
    labels:
      - 'dependencies'
      - 'security'
      - 'backend'
    commit-message:
      prefix: 'chore'
      prefix-scope: 'deps'
      include: 'scope'
    pull-request-branch-name:
      separator: '/'
    rebase-strategy: 'auto'
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    ignore:
      # Ignore major version bumps for certain packages (manual review recommended)
      - dependency-name: '@stellar/stellar-sdk'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'better-sqlite3'
        update-types:
          - 'version-update:semver-major'

  # npm dependencies — Frontend Web Dashboard
  - package-ecosystem: npm
    directory: '/stellar_card-frontend'
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 5
    reviewers:
      - 'devpeter999'
    labels:
      - 'dependencies'
      - 'security'
      - 'frontend'
    commit-message:
      prefix: 'chore'
      prefix-scope: 'deps'
      include: 'scope'
    pull-request-branch-name:
      separator: '/'
    rebase-strategy: 'auto'
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    ignore:
      # Ignore major version bumps for certain packages (manual review recommended) —
      # Next.js and React majors both need a deliberate, coordinated upgrade.
      - dependency-name: 'next'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  # Cargo dependencies — Soroban Smart Contract
  - package-ecosystem: cargo
    directory: '/stellar_card-contract'
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: UTC
    open-pull-requests-limit: 5
    reviewers:
      - 'devpeter999'
    labels:
      - 'dependencies'
      - 'security'
      - 'contract'
    commit-message:
      prefix: 'chore'
      prefix-scope: 'deps'
      include: 'scope'
    pull-request-branch-name:
      separator: '/'
    rebase-strategy: 'auto'
    ignore:
      # soroban-sdk is pinned to an exact version (`=22.0.11`) in Cargo.toml
      # because Soroban's ABI/host-function surface can break between minor
      # releases — major AND minor bumps need a deliberate, tested upgrade,
      # not an automated PR.
      - dependency-name: 'soroban-sdk'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: UTC
    open-pull-requests-limit: 5
    reviewers:
      - 'devpeter999'
    labels:
      - 'ci/cd'
      - 'security'
    commit-message:
      prefix: 'ci'
      prefix-scope: 'deps'
      include: 'scope'

  # Docker containers
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: UTC
    open-pull-requests-limit: 3
    reviewers:
      - 'devpeter999'
    labels:
      - 'docker'
      - 'security'
      - 'infra'
    commit-message:
      prefix: 'chore'
      prefix-scope: 'deps'
      include: 'scope'
