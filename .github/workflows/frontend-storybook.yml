name: Frontend Storybook

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'stellar_card-frontend/**'
      - '.github/workflows/frontend-storybook.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'stellar_card-frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook:
    name: Build & Test Storybook
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: 'stellar_card-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: stellar_card-frontend
        run: npm ci

      # Non-blocking: the frontend has pre-existing type/lint issues outside the
      # Storybook surface (unrelated app code); this job's job is to gate Storybook
      # specifically, so these are informational rather than a hard requirement.
      - name: Type check
        working-directory: stellar_card-frontend
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        working-directory: stellar_card-frontend
        run: npm run lint
        continue-on-error: true

      - name: Install Playwright browsers
        working-directory: stellar_card-frontend
        run: npx playwright install --with-deps chromium

      - name: Run Storybook interaction & a11y tests
        working-directory: stellar_card-frontend
        run: npm run test:storybook

      - name: Build Storybook
        working-directory: stellar_card-frontend
        run: npm run build-storybook

      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: stellar_card-frontend/storybook-static
          retention-days: 7
