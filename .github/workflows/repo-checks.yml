name: Repo Configuration Checks

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Validate dependabot, CI, docs, docker & husky config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install root check dependencies
        run: npm ci

      # commitlint.test.mjs shells out to stellar_card-sdk's commitlint
      # CLI to validate the shared .commitlintrc.json end-to-end.
      - name: Install SDK dependencies
        working-directory: stellar_card-sdk
        run: npm ci

      - name: Run repo configuration checks
        run: npm test
