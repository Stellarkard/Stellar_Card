name: E2E Tests

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'stellar_card-frontend/**'
      - '.github/workflows/e2e.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'stellar_card-frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stellar_card-frontend
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: 'stellar_card-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            stellar_card-frontend/test-results/
            stellar_card-frontend/playwright-report/
          retention-days: 7

  e2e-report:
    name: E2E Report
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Check E2E results
        run: |
          if [ "${{ needs.e2e.result }}" = "failure" ]; then
            echo "::error::E2E tests failed. Check the uploaded artifacts for details."
            exit 1
          fi
          echo "All E2E tests passed."
