name: Test & Lint

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'stellar_card-sdk/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'stellar_card-sdk/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: 'stellar_card-sdk/package-lock.json'

      # Explicit npm cache with a content-addressed key so the cache is
      # invalidated only when package-lock.json actually changes.  The
      # restore-keys fallback lets a branch reuse a slightly stale cache
      # rather than starting cold every time.
      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('stellar_card-sdk/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node${{ matrix.node-version }}-
            npm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: stellar_card-sdk
        run: npm ci

      # Cache the TypeScript incremental build output so subsequent runs that
      # touch only a few files compile faster.
      - name: Cache TypeScript build
        uses: actions/cache@v4
        with:
          path: stellar_card-sdk/.tsbuildinfo
          key: tsbuild-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('stellar_card-sdk/src/**', 'stellar_card-sdk/tsconfig*.json') }}
          restore-keys: |
            tsbuild-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Lint
        working-directory: stellar_card-sdk
        run: npm run lint
        continue-on-error: true

      - name: Type check
        working-directory: stellar_card-sdk
        run: npm run typecheck

      - name: Run tests
        working-directory: stellar_card-sdk
        run: npm run test
        env:
          CARDS402_ALLOW_INSECURE_BASE_URL: '1'

      - name: Build
        working-directory: stellar_card-sdk
        run: npm run build

      - name: Check browser entry has no Node built-ins
        working-directory: stellar_card-sdk
        run: npm run check:browser

      - name: Verify publishable package contents
        working-directory: stellar_card-sdk
        run: npm run verify:package

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        with:
          files: ./stellar_card-sdk/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  type-matrix:
    name: Type Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript-version: ['5.0.x', '5.1.x', '5.2.x', '5.3.x']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: 'stellar_card-sdk/package-lock.json'

      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-ubuntu-node20-ts${{ matrix.typescript-version }}-${{ hashFiles('stellar_card-sdk/package-lock.json') }}
          restore-keys: |
            npm-ubuntu-node20-ts${{ matrix.typescript-version }}-
            npm-ubuntu-node20-

      - name: Install dependencies
        working-directory: stellar_card-sdk
        run: npm ci

      - name: Install TypeScript version
        working-directory: stellar_card-sdk
        run: npm install --save-dev typescript@${{ matrix.typescript-version }}

      - name: Type check
        working-directory: stellar_card-sdk
        run: npm run typecheck
