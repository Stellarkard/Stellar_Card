name: Security Audit

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'stellar_card-sdk/package*.json'
      - 'stellar_card-backend/package*.json'
      - 'stellar_card-frontend/package*.json'
      - 'stellar_card-contract/Cargo.toml'
      - '.github/workflows/security.yml'
      - '.github/dependabot.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'stellar_card-sdk/package*.json'
      - 'stellar_card-backend/package*.json'
      - 'stellar_card-frontend/package*.json'
      - 'stellar_card-contract/Cargo.toml'
      - '.github/workflows/security.yml'
      - '.github/dependabot.yml'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: Security Audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ['stellar_card-sdk', 'stellar_card-backend', 'stellar_card-frontend']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: '${{ matrix.directory }}/package-lock.json'

      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: |
          npm ci --package-lock-only || true
          npm audit --audit-level=moderate || true

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
