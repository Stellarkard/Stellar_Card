name: Accessibility Audit

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'stellar_card-frontend/**'
      - '.github/workflows/a11y.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'stellar_card-frontend/**'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  a11y-audit:
    name: a11y audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          node-version: '20.x'
          working-directory: stellar_card-frontend

      - name: Install dependencies
        working-directory: stellar_card-frontend
        run: npm ci

      - name: Run Playwright tests with a11y
        working-directory: stellar_card-frontend
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Run Storybook a11y checks
        working-directory: stellar_card-frontend
        run: |
          npx storybook build --quiet
          npx @storybook/addon-a11y-test --storybook-static ./storybook-static
        continue-on-error: true

  audit-summary:
    name: Audit summary
    runs-on: ubuntu-latest
    needs: a11y-audit
    if: always()

    steps:
      - name: Report result
        run: |
          if [ "${{ needs.a11y-audit.result }}" = "success" ]; then
            echo "Accessibility audit passed."
          else
            echo "::warning::Accessibility audit had failures — check the a11y-audit job logs."
          fi
