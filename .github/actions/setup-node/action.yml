name: Setup Node.js with caching

description: |
  Composite action that sets up Node.js with optimized caching.
  Reusable across all workflows to keep cache keys consistent.

inputs:
  node-version:
    description: 'Node.js version to use'
    default: '20.x'
  working-directory:
    description: 'Directory containing package-lock.json'
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json'

    - name: Cache npm store
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          npm-${{ runner.os }}-node${{ inputs.node-version }}-
          npm-${{ runner.os }}-
